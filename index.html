<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiftRoll</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--ink:#ece9ff;--mute:#8f8ab3;--line:#2a2548;--card:#120f24cc;--v:#7c4dff;--c:#4de1ff;--h:265;--h2:200;--t:.25}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 20% 25%,hsl(var(--h) 85% 38%/.55),transparent 55%),radial-gradient(circle at 80% 75%,hsl(var(--h2) 85% 40%/.45),transparent 55%),var(--bg);background-size:140% 140%;animation:drift 18s ease-in-out infinite alternate}
#bg::after{content:"";position:absolute;inset:-50%;background:conic-gradient(transparent,hsl(var(--h) 90% 60%/.35),transparent 30%,hsl(var(--h2) 90% 60%/.3),transparent 65%);opacity:var(--t);animation:spin 40s linear infinite}
@keyframes drift{to{background-position:100% 100%}}
@keyframes spin{to{transform:rotate(360deg)}}
header,nav,main{max-width:920px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:18px}
h1{font:800 1.6rem Unbounded,sans-serif;background:linear-gradient(90deg,var(--c),#b69bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font:600 1rem Unbounded,sans-serif;margin-bottom:4px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600}
nav{display:flex;gap:6px;padding:0 18px 16px;overflow-x:auto}
button{font:inherit;color:inherit;cursor:pointer}
nav button{background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--mute);white-space:nowrap}
nav button.on{background:var(--v);color:#fff;border-color:var(--v)}
main{padding:0 18px 60px}
.panel{display:none}.panel.on{display:block}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{background:linear-gradient(135deg,var(--v),#4a2bc4);border:0;border-radius:10px;padding:8px 16px;font-weight:600;color:#fff;margin-top:8px}
.btn.alt{background:#2a2548}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.stage{text-align:center;padding:30px 14px}
#reel{font:800 clamp(1.8rem,7vw,3.4rem) Unbounded,sans-serif;min-height:1.4em;text-shadow:0 0 28px currentColor;word-break:break-word}
#odds{font-size:1.2rem;min-height:1.6em}
#rb{display:block;margin:26px auto 8px;width:170px;height:170px;border-radius:50%;border:0;font:800 1.6rem Unbounded,sans-serif;color:#fff;letter-spacing:.06em;background:radial-gradient(circle at 35% 30%,#a98bff,#4a2bc4 60%,#1b0f55);box-shadow:0 0 0 6px #ffffff10,0 0 60px hsl(var(--h) 90% 55%/.6);position:relative;transition:transform .15s}
#rb::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed hsl(var(--h) 90% 70%/.7);animation:spin 14s linear infinite}
#rb:hover{transform:scale(1.04)}#rb:active{transform:scale(.96)}
#rb:disabled{filter:grayscale(.6) brightness(.7);cursor:wait}
#al:not([hidden]){display:block;text-align:center}
#nx{text-align:center;min-height:1.5em;color:var(--c)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 18px;text-align:center;color:var(--mute)}
.stats b{display:block;color:var(--ink);font-size:1.2rem}
.ax{display:flex;flex-direction:column;gap:4px;padding:12px;border-color:hsl(var(--ah) 70% 45%/.6);box-shadow:inset 0 0 30px hsl(var(--ah) 80% 40%/.18)}
.ax .btn{align-self:flex-start;padding:4px 12px;margin-top:4px}
.ax.lock{opacity:.5;border-color:var(--line);box-shadow:none}
input,select{font:inherit;background:#0d0b1c;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#cut{position:fixed;inset:0;z-index:50;background:#03020c;display:none}
#cv{position:absolute;inset:0}
#rev{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0;filter:blur(14px)}}
#ok{transition:opacity 1s}
#rev.r1{animation-name:rise}#rev.r2{animation-name:spin}#rev.r3{animation-name:drop}
@keyframes rise{from{transform:translateY(90px) scale(.7);opacity:0;filter:blur(10px)}}@keyframes spin{from{transform:rotate(-25deg) scale(.2);opacity:0}}@keyframes drop{from{transform:translateY(-140px) scale(1.7);opacity:0}}
#rn{font:800 clamp(2.4rem,10vw,6rem) Unbounded,sans-serif;text-shadow:0 0 40px currentColor;line-height:1.1}
#ro{font-size:1.6rem}
#cnt{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:800 2rem Unbounded,sans-serif;display:none;pointer-events:none}
#cut{overflow:hidden}
#hnt{position:absolute;left:0;right:0;bottom:5%;text-align:center;font:600 1.3rem Unbounded,sans-serif;letter-spacing:.3em;display:none;pointer-events:none}
#skip{position:fixed;z-index:60;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:none;background:#ffffff18;border:1px solid #ffffff40;border-radius:99px;padding:6px 16px}
@media(prefers-reduced-motion:reduce){#bg,#bg::after,#rb::before{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<header><h1>RiftRoll</h1><div id="sh" class="pill"></div></header>
<nav id="tabs"></nav>
<main>
<section id="p-roll" class="panel on">
 <div class="card stage"><div id="eqn" class="mute"></div><div id="reel">Ready</div><div id="odds"></div><div id="gain" class="mute"></div><div id="sum" class="mute" style="margin-top:6px;font-size:.9rem"></div></div>
 <button id="rb">ROLL</button><div id="nx"></div>
 <div class="card" style="max-width:460px;margin:14px auto 0"><label class="mute" for="lk">Luck dial: <b id="dv" style="color:var(--ink)"></b></label><input type="range" id="lk" min="0" max="100" style="width:100%;accent-color:var(--v)"><div class="mute" style="font-size:.85rem">Turn it down to roll the common auras.</div></div>
 <label id="al" class="mute" hidden><input type="checkbox" id="auto"> Auto roll</label>
 <div class="stats" id="stats"></div>
</section>
<section id="p-up" class="panel"><div class="grid" id="ug"></div><h3 style="margin:22px 0 4px">Quests</h3><p class="mute" style="margin-bottom:10px">Quests spend your auras. The Index keeps them, but their count goes down.</p><div class="grid" id="uq"></div></section>
<section id="p-pot" class="panel"><p class="mute" style="margin-bottom:10px">Potions can't be bought. Craft them by spending auras.</p><div class="grid" id="pg"></div></section>
<section id="p-idx" class="panel"><p class="mute" id="ic" style="margin-bottom:12px"></p><div class="grid" id="ix" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))"></div></section>
<section id="p-code" class="panel">
 <div class="card"><h3>Redeem a code</h3><p class="mute">Enter a code to claim its reward.</p><p style="margin-top:10px"><input id="ci" placeholder="Code" autocomplete="off"> <button class="btn" id="cb">Redeem</button></p><p id="cm" style="margin-top:8px"></p></div>
 <div class="card" style="margin-top:12px"><h3>Settings</h3><p><label class="mute"><input type="checkbox" id="sn"> Sound effects</label></p><p class="mute" style="margin-top:10px">Play a cutscene for auras rarer than:</p><p style="margin-top:8px"><select id="cs"></select></p><p style="margin-top:14px"><button class="btn alt" id="rs0">Reset all progress</button></p></div>
</section>
</main>
<div id="cut"><canvas id="cv"></canvas>
 <div id="cnt"></div><div id="hnt"></div>
 <div id="rev"><div id="rn"></div><div id="ro"></div><div id="rs" class="mute"></div><button class="btn" id="ok">Continue</button></div>
</div>
<button id="skip">Skip</button>
<script>
const $=id=>document.getElementById(id),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const N0="Plain,Dust,Pebble,Mist,Ember,Frost,Moss,Breeze,Flicker,Glow,Spark,Tide,Sunset,Dawn,Twilight,Copper,Jade,Amber,Quartz,Opal,Ripple,Cinder,Gale,Lumen,Haze,Sapphire,Crimson,Verdant,Aurora,Echo,Prism,Nimbus,Solstice,Vortex,Mirage,Onyx,Tempest,Zephyr,Wraith,Lotus,Phoenix,Glacier,Eclipse,Thornveil,Starfall,Banshee,Cobalt,Inferno,Specter,Zenith,Nebula,Leviathan,Chimera,Valkyrie,Obsidian,Tsunami,Celestia,Dragonfire,Abyss,Seraph,Pulsar,Revenant,Hydra,Quasar,Voidwalker,Titan,Ragnarok,Astral,Oblivion,Genesis,Aether,Supernova,Cataclysm,Eternity,Paradox,Singularity,Armageddon,Chronos,Infinity,Omniscient,Riftborn,Event Horizon,Dreadnought,Primordial,Anomaly,Overlord,Apocalypse,Eden,Rift Walker,Cosmos,Worldbreaker,Divinity,Nirvana,Elysium,Big Bang,Omega,Alpha Prime,The Rift,Eternal Void,RiftHeart".split(",");
const N1="Static,Pollen,Cobweb,Ash,Drizzle,Clay,Reed,Lantern,Wisp,Shimmer,Candle,Brook,Dusk,Lava Drop,Chime,Rust,Willow,Honey,Granite,Pearl,Rainfall,Magma,Whisper,Beacon,Smoke,Topaz,Ruby,Fern,Borealis,Resonance,Kaleido,Cumulus,Equinox,Cyclone,Illusion,Jet,Monsoon,Sylph,Phantom,Orchid,Firebird,Iceberg,Umbra,Bramble,Meteor,Siren,Azure,Volcano,Ghoul,Apex,Galaxy,Kraken,Griffon,Sentinel,Magma Heart,Typhoon,Empyrean,Wyvern,Chasm,Archangel,Neutron,Phantasm,Basilisk,Blazar,Netherwalker,Colossus,Valhalla,Cosmic,Perdition,Origin,Ether,Hypernova,Calamity,Immortality,Enigma,Tesseract,Ragnar,Kronos,Boundless,Omnipotent,Voidborn,Horizon,Juggernaut,Ancestral,Aberration,Sovereign,Doomsday,Paradise,Rift Stalker,Universe,Realmbreaker,Godhood,Moksha,Avalon,Creation,Zeta,Omega Prime,The Void,Eternal Rift,RiftCrown".split(","),N=N0.flatMap((n,i)=>[n,N1[i]]);
const A=N.map((n,i)=>{let o=2*Math.pow(5e11,i/(N.length-1));o=o<100?Math.round(o):Number(o.toPrecision(2));return{i,n,o,h:(i*137.5)%360}});
for(let i=1;i<A.length;i++)if(A[i].o<=A[i-1].o)A[i].o=A[i-1].o+1;
const fmt=n=>{for(const[v,s]of[[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]])if(n>=v){const x=n/v;return(x>=100?Math.round(x):+x.toFixed(1))+s}return Math.round(n).toLocaleString()};
const fl=n=>n>=1e3?fmt(n):+n.toFixed(2);
const col=(h,l=68)=>`hsl(${h} 90% ${l}%)`;
// potions: id, name, luck multiplier, shard price
const P=[["lucky","Lucky Draught",5,500],["fort","Fortune Vial",25,1e4],["star","Starlit Elixir",100,2.5e5],["rift","Rift Tonic",500,1e7],["void","Void Nectar",2500,5e8],["ult","Ultimate Elixir",1e4,1e10]];
// upgrades: name, description, max level, base cost, cost growth
const U={speed:["Quick Roll","Rolls finish 12% faster per level.",10,30,1.8],luck:["Fortune","+15% luck per level.",40,60,1.6],magnet:["Shard Magnet","+50% shards from every aura per level.",25,50,1.7],twin:["Twin Roll","8% chance per level to roll twice and keep the rarer aura.",10,150,1.7],save:["Potion Saver","10% chance per level that your potion isn't used up.",8,400,1.9],rain:["Shard Rain","Earn shards every second, even while idle (level² × 2 per second).",15,100,1.65],crit:["Shard Crit","6% chance per level to earn ×5 shards from a roll.",10,200,1.7],multi:["Multi-Roll","Roll more auras with each press: ×2, ×3, ×5. The ×10 level is a quest.",3,2000,12.5],auto:["Auto Roll","Rolls for you. One-time unlock.",1,300,1]};
const KEY="riftroll_v4",D={shards:0,rolls:0,got:{},seen:{},q:{},up:{speed:0,luck:0,magnet:0,twin:0,save:0,rain:0,crit:0,multi:0,auto:0},pot:{},active:null,eq:0,founder:0,cut:1000,snd:1,lk:100};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...D}}
S.up=Object.assign({},D.up,S.up);S.pot=S.pot||{};S.got=S.got||{};S.seen=S.seen||{};S.q=S.q||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cost=k=>Math.floor(U[k][3]*Math.pow(U[k][4],S.up[k]));
const base=()=>(1+S.up.luck*.15)*(S.founder?2:1);
const tot=()=>base()*(S.active?P.find(p=>p[0]==S.active)[2]:1);
const luck=()=>Math.pow(tot(),S.lk/100);
// quests: spend auras (the Index keeps them, but the count goes down; your equipped aura keeps 1 copy)
const near=o=>A.reduce((b,x)=>Math.abs(Math.log(x.o/o))<Math.abs(Math.log(b.o/o))?x:b);
const avail=i=>(S.got[i]||0)-(S.eq==i&&(S.got[i]||0)>0?1:0);
const reqs=q=>q.map(([o,n])=>{const x=near(o);return{x,n,h:avail(x.i)}});
const can=q=>reqs(q).every(r=>r.h>=r.n);
const rq=q=>reqs(q).map(r=>`<div class="mute" style="font-size:.9rem">${r.x.n} (1 in ${fmt(r.x.o)}): <b style="color:${r.h>=r.n?"#7dffb0":"var(--ink)"}">${Math.max(0,r.h)}/${r.n}</b></div>`).join("");
const PQ={lucky:[[5,30],[50,10]],fort:[[50,40],[1e3,10]],star:[[1e3,10],[1e5,2]],rift:[[1e5,10],[3e6,1]],void:[[3e6,5],[3e8,1]],ult:[[5e8,1],[3e8,1],[1e7,10]]};
const UQ=[["multi10","Multi-Roll ×10","Roll 10 auras with every press.",[[3e6,1],[5,100]],()=>S.up.multi>=3],["surge10","Surge Amplifier","Your Tenth Roll Surge becomes ×10 luck instead of ×5.",[[1e8,1],[1e4,20]],()=>S.up.luck>=3]];

// tabs
const T=[["roll","Roll"],["up","Upgrades"],["pot","Potions"],["idx","Index"],["code","Codes"]];
$("tabs").innerHTML=T.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");
function tab(k){document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id=="p-"+k));document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k==k))}
$("tabs").onclick=e=>{if(e.target.dataset.k)tab(e.target.dataset.k)};tab("roll");
// background follows the equipped aura
function setBg(){const a=A[S.eq],s=document.documentElement.style;s.setProperty("--h",a.h);s.setProperty("--h2",(a.h+50)%360);s.setProperty("--t",Math.min(1,.2+Math.log10(a.o)/9*.8))}
// UI
function ui(){
 $("sh").textContent="◆ "+fmt(S.shards)+" shards";
 $("eqn").innerHTML=`Equipped: <b style="color:${col(A[S.eq].h)}">${A[S.eq].n}</b>`;
 $("stats").innerHTML=`<div>Rolls<b>${fmt(S.rolls)}</b></div><div>Luck<b>×${fl(luck())}</b></div><div>Per press<b>×${nRolls()}</b></div><div>Auras<b>${Object.keys(S.seen).length}/${A.length}</b></div>`;
 $("nx").textContent=(S.active?"Next roll: ×"+fmt(P.find(p=>p[0]==S.active)[2])+" luck  ·  ":"")+(S.rolls%10==9?"⚡ SURGE next roll! (×"+(S.q.surge10?10:5)+" luck)":"Surge in "+(10-S.rolls%10)+" rolls");
 $("al").hidden=!S.up.auto;$("lk").value=S.lk;$("dv").textContent="×"+fl(luck())+" of ×"+fl(tot());
 $("ug").innerHTML=Object.keys(U).map(k=>{const u=U[k],l=S.up[k],mx=l>=u[2];return`<div class="card"><h3>${u[0]}</h3><p class="mute">${u[1]}</p><p>Level ${l}/${u[2]}</p><button class="btn" data-u="${k}" ${mx||S.shards<cost(k)?"disabled":""}>${mx?(k=="auto"?"Owned":"Maxed"):"Buy · ◆ "+fmt(cost(k))}</button></div>`}).join("");
 $("pg").innerHTML=P.map(p=>`<div class="card"><h3>${p[1]}</h3><p class="mute">Next roll: ×${fmt(p[2])} luck</p><p>Owned: ${S.pot[p[0]]||0}${S.active==p[0]?" · active":""}</p>${rq(PQ[p[0]])}<button class="btn" data-b="${p[0]}" ${can(PQ[p[0]])?"":"disabled"}>Craft (spend auras)</button> <button class="btn alt" data-p="${p[0]}" ${(S.pot[p[0]]||0)<1?"disabled":""}>Use</button></div>`).join("");
 $("uq").innerHTML=UQ.filter(q=>S.q[q[0]]||q[4]()).map(q=>`<div class="card"><h3>${q[1]}</h3><p class="mute">${q[2]}</p>${S.q[q[0]]?"<p>✔ Completed</p>":rq(q[3])+`<button class="btn" data-q="${q[0]}" ${can(q[3])?"":"disabled"}>Complete quest</button>`}</div>`).join("")||'<p class="mute">More quests appear as you upgrade.</p>';
 $("ic").textContent=`Discovered ${Object.keys(S.seen).length} of ${A.length} auras.`;
 $("ix").innerHTML=A.map(a=>{const g=S.seen[a.i];return g?`<div class="card ax" style="--ah:${a.h}"><b style="color:${col(a.h)}">${a.n}</b><span class="mute">1 in ${fmt(a.o)} · ×${fmt(S.got[a.i]||0)}</span><button class="btn" data-e="${a.i}" ${S.eq==a.i?"disabled":""}>${S.eq==a.i?"Equipped":"Equip"}</button></div>`:`<div class="card ax lock"><b>???</b><span class="mute">1 in ${fmt(a.o)}</span></div>`}).join("");
}
$("ug").onclick=e=>{const k=e.target.dataset.u;if(!k)return;if(S.up[k]<U[k][2]&&S.shards>=cost(k)){S.shards-=cost(k);S.up[k]++;save();ui()}};
$("pg").onclick=e=>{const b=e.target.dataset;if(b.b){const q=PQ[b.b];if(can(q)){for(const r of reqs(q))S.got[r.x.i]-=r.n;S.pot[b.b]=(S.pot[b.b]||0)+1}}else if(b.p&&S.pot[b.p]>0){if(S.active)S.pot[S.active]++;S.pot[b.p]--;S.active=b.p}else return;save();ui()};
$("uq").onclick=e=>{const id=e.target.dataset.q;if(!id)return;const q=UQ.find(x=>x[0]==id);if(!S.q[id]&&can(q[3])){for(const r of reqs(q[3]))S.got[r.x.i]-=r.n;S.q[id]=1;save();ui()}};
$("ix").onclick=e=>{const i=e.target.dataset.e;if(i==null)return;S.eq=+i;setBg();save();ui()};
// codes
$("cb").onclick=()=>{const v=$("ci").value.trim().toLowerCase(),m=$("cm");$("ci").value="";
 if(v=="suga"){if(S.founder)m.textContent="Founder luck is already active on your account.";else{S.founder=1;m.textContent="FOUNDER unlocked: ×2 luck on every roll."}}
 else if(v=="6789"){if(S.c6789){m.textContent="Code 6789 was already redeemed."}else{S.c6789=1;S.pot.star=(S.pot.star||0)+1;m.textContent="You received 1 Starlit Elixir (×100 luck)."}}
 else if(v=="ksksiekjmeis3"){S.pot.ult=(S.pot.ult||0)+1;m.textContent="You received 1 Ultimate Elixir."}
 else{m.textContent="That code doesn't exist. Check the spelling.";return}
 save();ui()};
$("ci").onkeydown=e=>{if(e.key=="Enter")$("cb").click()};
$("cs").innerHTML=[[1e3,"1K+"],[1e4,"10K+"],[1e5,"100K+"],[1e6,"1M+"],[1e7,"10M+"],[1e8,"100M+"],[1e9,"1B+"],[1e12,"1T+"],[1e18,"Never"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
$("cs").value=String(S.cut);$("cs").onchange=e=>{S.cut=+e.target.value;save()};
$("sn").checked=!!S.snd;$("sn").onchange=e=>{S.snd=e.target.checked?1:0;save()};
$("lk").oninput=e=>{S.lk=+e.target.value;save();ui()};
$("rs0").onclick=()=>{if(confirm("Delete all progress? This can't be undone.")){S={...D,up:{...D.up},got:{},seen:{},q:{},pot:{}};save();setBg();ui()}};
// rolling
let busy=false;
function pick(L){for(let i=A.length-1;i>0;i--)if(Math.random()<Math.min(1,L/A[i].o))return i;return 0}
function show(r){$("reel").textContent=r.n;$("reel").style.color=col(r.h)}
const nRolls=()=>S.q.multi10?10:[1,2,3,5][S.up.multi];
function roll(){
 if(busy)return;busy=true;$("rb").disabled=true;$("odds").textContent="";$("gain").textContent="";$("sum").textContent="";
 const n=nRolls(),pt=S.active,pmul=pt?P.find(p=>p[0]==pt)[2]:1,cnt={};let best=null,bnew=false,g=0,sgHit=false;
 S.active=null;if(pt&&Math.random()<S.up.save*.1)S.active=pt;
 for(let r=0;r<n;r++){
  S.rolls++;const sg=S.rolls%10==0;if(sg)sgHit=true;
